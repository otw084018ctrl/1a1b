<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef0f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101215" media="(prefers-color-scheme: dark)">
<title>1A1B</title>
<style>
/* 版面：手機單欄。上方狀態列 → 中間記分表（可捲動）→ 底部固定數字盤；聊天與設定從底部滑出 */
:root{
  --bg:#eef0f2; --surface:#ffffff; --sunk:#e5e8ec; --ink:#15181c; --mute:#69707a; --faint:#a3a9b1; --line:#d7dbe0;
  --me:#2c5a8c; --me-soft:#e6edf5; --a:#1d7a4e; --b:#a46812; --warn:#b42318; --scrim:rgba(16,18,21,.38);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,"Roboto Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101215; --surface:#181b1f; --sunk:#0c0e10; --ink:#e6e8eb; --mute:#8b929b; --faint:#5a616a; --line:#2a2f36;
  --me:#86acd9; --me-soft:#1b2633; --a:#55c28d; --b:#e2b150; --warn:#f07462; --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101215; --surface:#181b1f; --sunk:#0c0e10; --ink:#e6e8eb; --mute:#8b929b; --faint:#5a616a; --line:#2a2f36;
  --me:#86acd9; --me-soft:#1b2633; --a:#55c28d; --b:#e2b150; --warn:#f07462; --scrim:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--me);outline-offset:2px}
.hide{display:none!important}
svg{display:block}

.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---------- 共用元件 ---------- */
.mark{font:700 40px/1 var(--mono);letter-spacing:-.02em}
.mark i{font-style:normal;color:var(--a)}.mark u{text-decoration:none;color:var(--b)}
.group{display:flex;flex-direction:column;gap:12px;padding-top:18px;border-top:1px solid var(--line)}
.glabel{font-size:12px;letter-spacing:.08em;color:var(--mute)}
.glabel small{letter-spacing:0;color:var(--faint);font-size:12px;margin-left:4px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px}
.field>span{font-size:14px;flex:none}
input{font:inherit;font-size:16px;width:100%;min-width:0;height:46px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
input::placeholder{color:var(--faint)}
input.need{border-color:var(--warn)}
.seg{display:flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px}
.row>.btn{flex:1}
.msg{font-size:13px;color:var(--warn);min-height:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;color:var(--mute)}
.tag{font-size:11px;border:1px solid currentColor;border-radius:5px;padding:0 6px;letter-spacing:.04em;flex:none;line-height:18px}
.tag.easy{color:var(--a)}.tag.multi{color:var(--me)}.tag.host{color:var(--b)}.tag.spec{color:var(--mute)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.on{background:var(--a)}
.textbtn{border:0;background:none;padding:6px 2px;font-size:14px;color:var(--mute);position:relative}
.textbtn.arm{color:var(--warn);font-weight:600}
.linkbtn{border:0;background:none;color:var(--mute);font-size:14px;padding:8px 0;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}

/* ---------- 大廳 ---------- */
.lobby{overflow:auto;padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));gap:22px}
.rules{margin:0;color:var(--mute);font-size:14px;line-height:1.7}
.rules b{font-family:var(--mono)}
.ta{color:var(--a)}.tb{color:var(--b)}
#roomIn{font-family:var(--mono);text-transform:uppercase;letter-spacing:.3em}

.rlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.ritem{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.ritem:first-child{border-top:0}
.ritem .info{flex:1;min-width:0}
.ritem .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .nm .cd{font:500 12px var(--mono);letter-spacing:.12em;color:var(--faint);margin-left:6px}
.ritem .meta{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .acts{display:flex;gap:6px;flex:none}
.ritem .acts button{font-size:13px;font-weight:600;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:none}
.ritem .acts button.play{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rempty{padding:18px 14px;color:var(--faint);font-size:14px;text-align:center}

.invite{justify-content:center}
.invite .host{color:var(--mute);font-size:14px}
.invite .rname{font-size:28px;font-weight:700;line-height:1.25;text-wrap:balance}
.invite .rcode{font:600 14px var(--mono);letter-spacing:.24em;color:var(--mute)}

/* ---------- 遊戲畫面 ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(10px,env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.bar .left{display:flex;align-items:center;gap:8px;min-width:0}
.bar .title{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{font:600 12px var(--mono);letter-spacing:.18em;color:var(--mute);flex:none}
.bar .right{display:flex;align-items:center;gap:14px;flex:none}
.badge{position:absolute;top:0;right:-10px;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--warn);color:#fff;font:700 11px/17px var(--sans);text-align:center}

.status{padding:12px 16px 0;position:relative}
.status .line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);min-width:0}
.who b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clock{font:600 14px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
.clock.low{color:var(--warn)}
.turn{font-size:20px;font-weight:700;margin-top:6px}
.turn.mine{color:var(--me)}
.turn.idle{color:var(--mute);font-weight:500}
.sub{font-size:13px;color:var(--mute);min-height:20px}
.timebar{height:2px;background:var(--line);margin-top:10px;border-radius:2px;overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:var(--ink);transform-origin:left;transition:transform .2s linear}
.timebar.low i{background:var(--warn)}

/* 觀戰名單 */
.watchers{display:flex;align-items:center;gap:6px;padding:8px 16px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
.watchers svg{flex:none;width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.watchers span{overflow:hidden;text-overflow:ellipsis}
.watchers b{color:var(--ink);font-weight:600}

/* 對手訊息泡泡 */
.toast{position:absolute;left:12px;right:16px;top:38px;z-index:5;display:flex;pointer-events:none}
.toast div{position:relative;max-width:100%;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px 14px 14px 14px;font-size:15px;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.18);pointer-events:auto;cursor:pointer;word-break:break-word;transform-origin:top left;animation:bubble .28s cubic-bezier(.2,.9,.3,1.3)}
.toast div::before{content:"";position:absolute;left:0;top:-7px;border:7px solid transparent;border-left-color:var(--ink);border-bottom:0}
.toast div.emo{font-size:34px;line-height:1.1;padding:6px 10px}
.toast b{font-weight:600;opacity:.65;margin-right:6px;font-size:13px}
.toast div.emo b{font-size:13px;vertical-align:middle}
@keyframes bubble{from{transform:scale(.6);opacity:0}}

.sheet{flex:1;min-height:0;overflow:auto;padding:0 16px;-webkit-overflow-scrolling:touch}

/* 房間等待區 */
.wait{padding:24px 0;display:flex;flex-direction:column;gap:18px}
.wait .codebox{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.wait .big{font:700 48px/1 var(--mono);letter-spacing:.18em;margin:4px 0}
.wait .k{font-size:12px;letter-spacing:.08em;color:var(--mute)}
.share{display:flex;flex-direction:column;gap:8px;width:100%}
.share .url{font:13px var(--mono);color:var(--mute);word-break:break-all;user-select:all;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;text-align:center}
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.plist .ph{display:flex;justify-content:space-between;padding:10px 14px;font-size:12px;color:var(--mute);letter-spacing:.06em;border-bottom:1px solid var(--line)}
.prow{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.ph+.prow{border-top:0}
.prow .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .nm small{font-weight:400;color:var(--faint);margin-left:4px}
.prow.vacant .nm{color:var(--faint);font-weight:400}
.waithint{font-size:13px;color:var(--mute);text-align:center}

/* 1 對 1 設定數字倒數 */
.setv{padding:28px 0 12px;text-align:center}
.count{font:700 84px/1 var(--mono);font-variant-numeric:tabular-nums}
.count.low{color:var(--warn)}
.setv p{margin:12px 0 0;color:var(--mute);font-size:14px}
.setv .mine{font:700 28px var(--mono);letter-spacing:.2em;color:var(--ink);margin-top:14px}

/* 記分表（1 對 1） */
.board{padding:10px 0 16px}
.bhead,.brow{display:grid;grid-template-columns:22px 1fr 1fr;gap:8px;align-items:center}
.bhead{position:sticky;top:0;background:var(--bg);padding:8px 0;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);z-index:1}
.bhead>span{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.bhead .me{color:var(--me);font-weight:600}
.bhead em{font-style:normal;font-family:var(--mono);letter-spacing:.12em;color:var(--ink)}
.brow{padding:4px 0;border-bottom:1px solid var(--line)}
.brow .n,.mrow .n{font:12px var(--mono);color:var(--faint);text-align:center}
.cell{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px;border-radius:8px;min-height:42px}
.cell.me{background:var(--me-soft)}
.cell .dg{font:600 18px var(--mono);letter-spacing:.12em}
.cell .rs{font:600 14px var(--mono);white-space:nowrap}
.dg .hit{color:var(--a);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.rs .ra{color:var(--a)}.rs .rb{color:var(--b)}.rs .zero{color:var(--faint)}
.cell.to .dg{font:500 13px var(--sans);letter-spacing:0;color:var(--faint)}
.cell.win{box-shadow:inset 0 0 0 1.5px var(--a)}
.cell.new{animation:pop .5s ease-out}
@keyframes pop{from{background:var(--sunk)}}
.empty{padding:28px 0;text-align:center;color:var(--faint);font-size:14px}

/* 答案遮罩 + 小眼睛 */
.secret{display:inline-flex;align-items:center;gap:4px}
.secret em{font-style:normal;font-family:var(--mono);letter-spacing:.12em;color:var(--ink)}
.eye{border:0;background:none;padding:2px;color:var(--mute);display:inline-grid;place-items:center;border-radius:6px}
.eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}

/* 多人競速 */
.race{padding:12px 0 16px;display:flex;flex-direction:column;gap:14px}
.answer{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1px dashed var(--line);border-radius:10px;font-size:13px;color:var(--mute)}
.answer .secret em{font-size:20px;font-weight:700}
.stand{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.stand::-webkit-scrollbar{display:none}
.scard{flex:none;min-width:96px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.scard .nm{font-size:13px;font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px}
.scard .st{font-size:11px;color:var(--faint)}
.scard .st.done{color:var(--a)}
.scard .lr{font:600 15px var(--mono)}
.scard.out{opacity:.5}
.scard.win{border-color:var(--a)}
.sect{font-size:12px;color:var(--mute);letter-spacing:.06em;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.sect .me{color:var(--me);font-weight:600}
.mrow{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
/* 觀戰：每位玩家一段 */
.pblock{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px}
.pblock .hd{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;margin-bottom:6px}
.pblock .hd .st{margin-left:auto;font-size:12px;font-weight:400;color:var(--faint)}
.pblock .hd .st.done{color:var(--a)}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
.gchip{display:flex;gap:8px;align-items:center;padding:5px 9px;border-radius:8px;background:var(--sunk);font:600 14px var(--mono)}
.gchip .dg{letter-spacing:.1em}
.gchip.to{color:var(--faint);font:500 12px var(--sans)}
.gchip.win{box-shadow:inset 0 0 0 1.5px var(--a)}
.gnone{font-size:13px;color:var(--faint)}

/* 筆記列 */
.notes{display:flex;align-items:center;gap:6px;padding:8px 16px;border-top:1px solid var(--line)}
.notes .lbl{font-size:12px;color:var(--mute);margin-right:4px;flex:none}
.notes button{flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:7px;background:none;font:500 14px var(--mono);padding:0}
.notes button.x{color:var(--faint);text-decoration:line-through;border-color:transparent}
.notes button.y{color:var(--a);border-color:var(--a);font-weight:700}

/* 底部數字盤 */
.dock{background:var(--surface);border-top:1px solid var(--line);padding:12px 12px max(12px,env(safe-area-inset-bottom))}
.slots{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
.slot{width:44px;height:50px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;font:600 24px var(--mono);border:1.5px solid transparent}
.slot.cur{border-color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.keys button{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font:500 20px var(--mono);padding:0}
.keys button:active:not(:disabled){background:var(--sunk)}
.keys button:disabled{color:var(--faint);opacity:.55}
.keys .del{font-family:var(--sans);font-size:18px}
.keys .go{background:var(--ink);color:var(--bg);border-color:var(--ink);font:600 15px var(--sans)}
.keys .go:disabled{background:var(--sunk);color:var(--faint);border-color:var(--line);opacity:1}
.dmsg{font-size:13px;text-align:center;min-height:18px;margin:-4px 0 6px;color:var(--mute)}
.dmsg.err{color:var(--warn)}

/* 結算 */
.over{display:flex;flex-direction:column;gap:6px;padding:4px 4px 0}
.over .otitle{font-size:26px;font-weight:700}
.over .otitle.win{color:var(--a)}.over .otitle.lose{color:var(--warn)}
.over .why{font-size:14px;color:var(--mute)}
.over .reveal{display:flex;gap:18px;margin:8px 0 12px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.over .reveal b{display:block;font:600 22px var(--mono);letter-spacing:.14em;color:var(--ink)}

/* 底部滑出面板（聊天、設定） */
.wrap{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end;background:var(--scrim)}
.panel{background:var(--surface);border-radius:16px 16px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out;max-height:86%}
.panel.chat{height:72%;max-height:560px}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.phead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.phead b{font-size:16px}
.pbody{padding:16px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.pfoot{padding:0 16px max(16px,env(safe-area-inset-bottom))}
.msgs{flex:1;min-height:0;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.msgs .none{margin:auto;color:var(--faint);font-size:14px}
.m{display:flex;flex-direction:column;align-items:flex-start;max-width:80%}
.m.mine{align-self:flex-end;align-items:flex-end}
.m .nm{font-size:11px;color:var(--faint);margin:0 4px 2px;display:flex;gap:4px;align-items:center}
.m .nm .tag{font-size:10px;line-height:15px;padding:0 4px}
.m .tx{padding:7px 12px;border-radius:14px;background:var(--sunk);font-size:15px;line-height:1.45;word-break:break-word}
.m.mine .tx{background:var(--me-soft);color:var(--ink)}
.m .tx.emo{background:none;padding:0 2px;font-size:38px;line-height:1.1}
.quick{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:14px;white-space:nowrap}
.quick button:active{background:var(--sunk)}
.emos{display:flex;gap:2px;overflow-x:auto;padding:8px 12px 0;scrollbar-width:none}
.emos::-webkit-scrollbar{display:none}
.emos button{flex:none;border:0;background:none;font-size:26px;width:44px;height:44px;border-radius:10px;padding:0}
.emos button:active{background:var(--sunk)}
.cform{display:flex;gap:8px;padding:10px 12px max(12px,env(safe-area-inset-bottom))}
.cform input{height:42px;border-radius:21px}
.cform .btn{height:42px;border-radius:21px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="app">

<!-- 大廳 -->
<section id="lobby" class="screen lobby">
  <div class="mark">1<i>A</i>1<u>B</u></div>
  <p class="rules">猜出 4 位數，數字不重複、首位不為 0。<b class="ta">A</b>＝數字與位置都對，<b class="tb">B</b>＝數字對但位置不對。<br><b>1 對 1</b>：兩人各設一組數字，輪流猜對方的，先猜到 4A 的人獲勝；先手猜中時，後手還有一次追平機會。<br><b>多人競速</b>：系統出一組數字，2–8 人每回合各猜一次，最快猜中的人贏。<br>簡單模式會直接報 A 的位置。</p>
  <div class="group" style="border-top:0;padding-top:0">
    <label class="glabel" for="name">你的名字</label>
    <input id="name" maxlength="12" placeholder="輸入暱稱" autocomplete="off" enterkeyhint="done">
  </div>
  <div class="group">
    <div class="glabel">開新房間</div>
    <input id="roomName" maxlength="16" placeholder="房間名稱（可不填）" autocomplete="off" enterkeyhint="done" aria-label="房間名稱">

  <form class="group" id="joinForm" autocomplete="off">
    <label class="glabel" for="roomIn">用代碼加入</label>
    <div class="row">
      <input id="roomIn" maxlength="6" placeholder="代碼" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go" style="flex:1">

<!-- 邀請連結打開時 -->
<section id="invite" class="screen lobby invite hide">
  <div class="mark" style="font-size:28px">1<i>A</i>1<u>B</u></div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div class="host" id="invHost"></div>
    <div class="rname" id="invName"></div>

  <div class="chips" id="invChips"></div>

<!-- 遊戲 -->
<section id="game" class="screen hide">
  <header class="bar">
    <div class="left"><span class="title" id="roomTitle"></span><span class="code" id="roomCode"></span><span class="tag multi hide" id="tagRace">多人</span><span class="tag easy hide" id="tagEasy">簡單</span></div>

  <div class="watchers hide" id="watchers"></div>

    <div class="line">
      <div class="who" id="who"></div>
      <span class="clock" id="clock"></span>
    </div>
    <div class="turn" id="turn"></div>
    <div class="sub" id="sub"></div>
    <div class="timebar hide" id="timebar"><i id="timefill"></i></div>
    <div class="toast hide" id="toast"><div id="toastIn"></div></div>

    <div class="panel" role="dialog" aria-label="房間設定">

      <div class="pbody">
        <input id="sName" maxlength="16" placeholder="房間名稱（可不填）" autocomplete="off" aria-label="房間名稱">
        <div class="field"><span>玩法</span><div class="seg" id="sGame"></div></div>
        <div class="field"><span>提示</span><div class="seg" id="sHint"></div></div>
        <div class="field"><span>觀戰看答案</span><div class="seg" id="sPeek"></div></div>
        <div class="field" id="sFieldSet"><span>設定數字</span><div class="seg" id="sSet"></div></div>
        <div class="field"><span>每回合思考</span><div class="seg" id="sTurn"></div></div>
        <div class="msg" id="sMsg"></div>

      <div class="pfoot"><button type="button" class="btn primary" id="sSave" style="width:100%">儲存設定</button></div>
    </div>

</div>
<script>
const $ = id => document.getElementById(id);
const show = (id, on) => $(id).classList.toggle('hide', !on);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const store = t => ({
  get: k => { try { return window[t + 'Storage'].getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { window[t + 'Storage'].setItem(k, v); } catch (e) {} },
  del: k => { try { window[t + 'Storage'].removeItem(k); } catch (e) {} },
});
const LS = store('local'), SS = store('session');

const QUICK = ['快一點', '快睡著了', '你只剩一次機會', '我要猜到了', '好菜'];
const EMOJI = [['🥲', '哭笑不得'], ['🥱', '打哈欠'], ['😭', '哭哭'], ['🤣', '大笑'], ['😏', '得意'], ['🤔', '思考'], ['😱', '嚇到'], ['😤', '不服'], ['👍', '讚'], ['🙏', '拜託']];
const EMOJI_SET = new Set(EMOJI.map(e => e[0]));
const EYE = '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';

const GAME_LABEL = { duel: '1 對 1', race: '多人競速' };
const hintLabel = h => h === 'easy' ? '簡單模式' : '標準模式';
const turnLabel = t => t ? '每回合 ' + t + ' 秒' : '不限時';
const roomTitle = (name, host) => name || (host ? host + ' 的房間' : '1A1B');

let S = null, room = null, pid = null, es = null;
let entry = '', mode = null, sending = false, canGuess = false;
let deadline = 0, total = 0;
let reveal = LS.get('1a1b-reveal') === '1';
const qs = new URLSearchParams(location.search);

async function post(path, body) {
  const r = await fetch('/api/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || '發生錯誤');
  return j;
}
const act = (path, body) => post(path, Object.assign({ room, pid }, body || {}));
function screen(id) { ['lobby', 'invite', 'game'].forEach(s => show(s, s === id)); if (id === 'lobby') loadRooms(); }

// ---------- 分段選擇 ----------
function seg(el, opts, fmt, val, onChange) {
  el.dataset.val = String(val);
  el.innerHTML = opts.map(o => '<button type="button" data-v="' + o + '">' + fmt(o) + '</button>').join('');
  const paint = () => el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === el.dataset.val));
  el.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    el.dataset.val = b.dataset.v; paint(); if (onChange) onChange(b.dataset.v);
  };
  paint();
}
const pick = (key, opts) => { const v = LS.get(key); return opts.map(String).includes(v) ? v : String(opts[0]); };
function lobbySeg(id, key, opts, fmt, after) {
  seg($(id), opts, fmt, pick(key, opts), v => { LS.set(key, v); if (after) after(); });
}
const turnOpts = game => game === 'race' ? [40, 60] : [0, 40, 60]; // 多人競速不能不限時，不然一個人發呆全場都在等
const fmtTurn = o => o ? o + ' 秒' : '不限';
function buildTurn(el, game, want, onChange) {
  const v = turnOpts(game).map(String).includes(String(want)) ? String(want) : (game === 'race' ? '60' : '0');
  seg(el, turnOpts(game), fmtTurn, v, onChange);
}
const syncLobby = () => {
  const game = $('segGame').dataset.val;
  show('fieldSet', game === 'duel');
  buildTurn($('segTurn'), game, LS.get('1a1b-turn2'), v => LS.set('1a1b-turn2', v));
};
const fmtPeek = o => o === 'on' ? '可以' : '不可';
lobbySeg('segGame', '1a1b-game', ['duel', 'race'], o => GAME_LABEL[o], syncLobby);
lobbySeg('segHint', '1a1b-mode', ['normal', 'easy'], o => o === 'easy' ? '簡單' : '標準');
lobbySeg('segPeek', '1a1b-peek', ['off', 'on'], fmtPeek);
lobbySeg('segSet', '1a1b-set', [10, 20, 30], o => o + ' 秒');
syncLobby();
$('name').value = LS.get('1a1b-name') || '';
$('invNameIn').value = LS.get('1a1b-name') || '';

// ---------- 進房 ----------
async function enter(code, role, nameIn, msgEl) {
  msgEl = msgEl || $('lobbyMsg');
  msgEl.textContent = '';
  const name = (nameIn != null ? nameIn : $('name').value).trim();
  if (role === 'spec' && !name) {
    msgEl.textContent = '觀戰要先輸入名字';
    const inp = nameIn != null ? $('invNameIn') : $('name');
    inp.classList.add('need'); inp.focus();
    return;
  }
  if (name) { LS.set('1a1b-name', name); $('name').value = name; $('invNameIn').value = name; }
  code = (code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  try {
    const j = await post('join', {
      room: code, name, role, pid: code ? SS.get('1a1b-pid-' + code) : null,
      roomName: $('roomName').value,
      settings: { game: $('segGame').dataset.val, hint: $('segHint').dataset.val, peek: $('segPeek').dataset.val, setSec: $('segSet').dataset.val, turnSec: $('segTurn').dataset.val },
    });
    room = j.room; pid = j.pid;
    SS.set('1a1b-pid-' + room, pid);
    try { history.replaceState(null, '', '?room=' + room); } catch (e) {}
    if (document.activeElement) document.activeElement.blur();
    $('roomName').value = '';
    connect();
  } catch (e) {
    if ($('game').classList.contains('hide') && $('invite').classList.contains('hide')) screen('lobby');
    ($('lobby').classList.contains('hide') ? msgEl : $('lobbyMsg')).textContent = e.message;
  }
}
['name', 'invNameIn'].forEach(id => $(id).addEventListener('input', e => e.target.classList.remove('need')));
$('createBtn').onclick = () => enter('', 'player');
$('joinForm').addEventListener('submit', e => {
  e.preventDefault();
  if (!$('roomIn').value.trim()) { $('lobbyMsg').textContent = '請輸入房間代碼'; return; }
  enter($('roomIn').value, 'player');
});

// 房間列表（大廳開著時每 3 秒更新）
async function loadRooms() {
  if ($('lobby').classList.contains('hide')) return;
  let list;
  try { list = (await post('rooms')).rooms; } catch (e) { return; }
  $('rlist').innerHTML = list.length ? list.map(r => {
    const state = r.phase === 'setting' || r.phase === 'playing' ? '對戰中' : r.players + '/' + r.max + ' 人';
    const meta = [GAME_LABEL[r.settings.game], state, r.specs ? '觀戰 ' + r.specs : '', r.host ? r.host + ' 開的' : ''].filter(Boolean).join(' · ');
    return '<div class="ritem"><div class="info"><div class="nm">' + esc(roomTitle(r.name, r.host)) + '<span class="cd">' + r.code + '</span></div>'
      + '<div class="meta">' + esc(meta) + '</div></div><div class="acts">'
      + '<button type="button" data-code="' + r.code + '" data-role="spec">觀戰</button>'
      + (r.joinable ? '<button type="button" class="play" data-code="' + r.code + '" data-role="player">加入</button>' : '')
      + '</div></div>';
  }).join('') : '<div class="rempty">目前沒有開著的房間，自己開一間吧</div>';
}
$('rlist').addEventListener('click', e => {
  const b = e.target.closest('button[data-code]'); if (!b) return;
  enter(b.dataset.code, b.dataset.role);
});
setInterval(loadRooms, 3000);

// ---------- 邀請連結 ----------
let inviteCode = null;
async function openInvite(code) {
  let info;
  try { info = await post('info', { room: code }); }
  catch (e) { screen('lobby'); $('lobbyMsg').textContent = '邀請的房間 ' + code + ' 已經關閉了'; return; }
  // 記得名字、而且還有位子的人直接進房
  if (info.joinable && LS.get('1a1b-name')) return enter(code, 'player', LS.get('1a1b-name'));
  inviteCode = code;
  $('invHost').textContent = (info.host || '朋友') + ' 邀請你加入';
  $('invName').textContent = roomTitle(info.name, info.host);
  $('invCode').textContent = '房間 ' + info.code;
  $('invChips').innerHTML = [GAME_LABEL[info.settings.game], hintLabel(info.settings.hint), turnLabel(info.settings.turnSec), info.players + '/' + info.max + ' 人']
    .map(t => '<span class="chip">' + t + '</span>').join('');
  show('invGo', info.joinable);
  $('invNameNote').textContent = info.joinable ? '加入對戰可不填，觀戰要填' : '這局進行中，可以先觀戰';
  $('invWatch').classList.toggle('primary', !info.joinable);
  screen('invite');
}
$('invGo').onclick = () => enter(inviteCode, 'player', $('invNameIn').value, $('invMsg'));
$('invWatch').onclick = () => enter(inviteCode, 'spec', $('invNameIn').value, $('invMsg'));
$('invNameIn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); ($('invGo').classList.contains('hide') ? $('invWatch') : $('invGo')).click(); } });
$('invBack').onclick = () => { try { history.replaceState(null, '', location.pathname); } catch (e) {} screen('lobby'); };

function connect() {
  if (es) es.close();
  es = new EventSource('/events?room=' + room + '&pid=' + pid);
  es.onmessage = e => { S = JSON.parse(e.data); render(); };
  es.onerror = () => { $('sub').textContent = '連線中斷，重新連線中…'; };
  chatSeen = -1; chatRendered = -1; lastMoves = -1;
  screen('game');
}
function backToLobby() {
  if (es) { es.close(); es = null; }
  SS.del('1a1b-pid-' + room);
  S = null; room = null; pid = null; mode = null; entry = '';
  closePanels(); show('toast', false);
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  $('roomIn').value = '';
  screen('lobby');
}

// ---------- 分享 ----------
function inviteUrl(s) {
  const local = ['localhost', '127.0.0.1', '::1', '[::1]'].includes(location.hostname);
  const base = local && s.ips.length ? 'http://' + s.ips[0] + ':' + s.port : location.origin;
  return base + '/?room=' + s.code;
}
function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise((ok, fail) => {
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
    let done = false;
    try { done = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    done ? ok() : fail();
  });
}
$('shareBtn').onclick = async () => {
  if (!S) return;
  const url = inviteUrl(S), b = $('shareBtn');
  if (navigator.share) {
    try { await navigator.share({ title: '來玩 1A1B：' + roomTitle(S.name, hostName(S)), url }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  copyText(url).then(() => { b.textContent = '已複製，貼給朋友就好'; })
    .catch(() => { b.textContent = '請長按下面的網址複製'; });
  setTimeout(() => { b.textContent = '複製邀請連結'; }, 2500);
};

// ---------- 數字盤 ----------
const KEYS = ['1','2','3','4','5','del','6','7','8','9','0','go'];
$('keys').innerHTML = KEYS.map(k =>
  k === 'del' ? '<button type="button" class="del" data-k="del" aria-label="刪除">⌫</button>'
  : k === 'go' ? '<button type="button" class="go" data-k="go"></button>'
  : '<button type="button" data-k="' + k + '">' + k + '</button>').join('');
function canPress(d) {
  if (entry.length >= 4 || entry.includes(d)) return false;
  return !(d === '0' && entry.length === 0); // 首位不能是 0
}
function canSubmit() {
  if (entry.length !== 4 || sending) return false;
  return mode === 'secret' || (mode === 'guess' && canGuess);
}
function press(d) { if (mode && canPress(d)) { entry += d; dmsg(''); renderEntry(); } }
function backspace() { if (mode && entry) { entry = entry.slice(0, -1); renderEntry(); } }
async function submit() {
  if (!canSubmit()) return;
  sending = true; renderEntry();
  try {
    await act(mode === 'secret' ? 'secret' : 'guess', mode === 'secret' ? { secret: entry } : { guess: entry });
    entry = ''; dmsg('');
  } catch (e) { dmsg(e.message, true); }
  sending = false; renderEntry();
}
$('keys').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const k = b.dataset.k;
  if (k === 'del') backspace(); else if (k === 'go') submit(); else press(k);
});
document.addEventListener('keydown', e => {
  if (!mode || panelOpen() || e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[0-9]$/.test(e.key)) { press(e.key); e.preventDefault(); }
  else if (e.key === 'Backspace') { backspace(); e.preventDefault(); }
  else if (e.key === 'Enter') { submit(); e.preventDefault(); }
});
function renderEntry() {
  $('slots').innerHTML = [0, 1, 2, 3].map(i =>
    '<div class="slot' + (i === entry.length && mode ? ' cur' : '') + '">' + (entry[i] || '') + '</div>').join('');
  const me = S && myPlayer(S);
  $('keys').querySelectorAll('button').forEach(b => {
    const k = b.dataset.k;
    if (k === 'del') b.disabled = !entry;
    else if (k === 'go') {
      b.disabled = !canSubmit();
      b.textContent = mode === 'secret' ? '設定' : canGuess ? '送出' : (me && me.submitted ? '已送出' : '等待');
    } else b.disabled = !canPress(k);
  });
}
function dmsg(t, err) { $('dmsg').textContent = t; $('dmsg').classList.toggle('err', !!err); }

// ---------- 面板（聊天、設定） ----------
const panelOpen = () => !$('chatWrap').classList.contains('hide') || !$('setWrap').classList.contains('hide');
function closePanels() {
  show('chatWrap', false); show('setWrap', false);
  if (document.activeElement && document.activeElement.tagName === 'INPUT') document.activeElement.blur();
}
document.querySelectorAll('.wrap').forEach(w => w.addEventListener('click', e => {
  if (e.target === w || e.target.closest('[data-close]')) closePanels();
}));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && panelOpen()) closePanels(); });

// ---------- 聊天 ----------
let chatSeen = -1, chatRendered = -1, toastTimer = 0;
$('quick').innerHTML = QUICK.map(q => '<button type="button">' + q + '</button>').join('');
$('emos').innerHTML = EMOJI.map(e => '<button type="button" aria-label="' + e[1] + '" title="' + e[1] + '">' + e[0] + '</button>').join('');
async function say(text) {
  text = String(text || '').trim();
  if (!text || !room) return false;
  try { await act('chat', { text }); return true; }
  catch (e) { $('chatIn').placeholder = e.message; setTimeout(() => { $('chatIn').placeholder = '輸入訊息'; }, 1500); return false; }
}
$('quick').addEventListener('click', e => { const b = e.target.closest('button'); if (b) say(b.textContent); });
$('emos').addEventListener('click', e => { const b = e.target.closest('button'); if (b) say(b.textContent); });
$('chatForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (await say($('chatIn').value)) $('chatIn').value = '';
});
function openChat() { closePanels(); show('chatWrap', true); show('toast', false); renderChat(true); }
$('chatBtn').onclick = openChat;
$('toast').onclick = openChat;

function renderChat(force) {
  const list = S ? S.chat : [];
  const lastId = list.length ? list[list.length - 1].id : 0;
  const open = !$('chatWrap').classList.contains('hide');
  if (chatSeen < 0) chatSeen = lastId; // 剛進房，舊訊息不算未讀
  if (open) chatSeen = lastId;
  const unread = list.filter(m => !m.mine && m.id > chatSeen).length;
  $('badge').textContent = unread > 9 ? '9+' : unread;
  show('badge', unread > 0);

  // 別人的新訊息：聊天室沒開時，在狀態列冒出泡泡
  const fresh = list.filter(m => !m.mine && m.id > chatRendered);
  if (!open && chatRendered >= 0 && fresh.length) {
    const m = fresh[fresh.length - 1];
    const opp = duelOpp(S);
    const fromOpp = S.settings.game === 'duel' && S.me.role === 'player' && opp && m.from === opp.pub;
    const tin = $('toastIn');
    tin.innerHTML = (fromOpp ? '' : '<b>' + esc(m.name) + (m.spec ? '（觀眾）' : '') + '</b>') + esc(m.text);
    tin.className = EMOJI_SET.has(m.text) ? 'emo' : '';
    show('toast', false); void tin.offsetWidth; show('toast', true);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => show('toast', false), 4000);
  }
  if (lastId === chatRendered && !force) return;
  chatRendered = lastId;
  if (!open) return;
  const box = $('msgs');
  box.innerHTML = list.length ? list.map(m =>
    '<div class="m' + (m.mine ? ' mine' : '') + '">'
    + (m.mine ? '' : '<span class="nm">' + esc(m.name) + (m.spec ? '<span class="tag spec">觀眾</span>' : '') + '</span>')
    + '<span class="tx' + (EMOJI_SET.has(m.text) ? ' emo' : '') + '">' + esc(m.text) + '</span></div>').join('')
    : '<div class="none">還沒有訊息，丟個快捷語嗆一下吧</div>';
  box.scrollTop = box.scrollHeight;
}

// ---------- 房間設定（房主） ----------
function openSettings() {
  if (!S) return;
  closePanels();
  const st = S.settings;
  $('sName').value = S.name || '';
  $('sMsg').textContent = '';
  let want = st.turnSec;
  const sync = () => {
    const game = $('sGame').dataset.val;
    show('sFieldSet', game === 'duel');
    buildTurn($('sTurn'), game, want, v => { want = v; });
  };
  seg($('sGame'), ['duel', 'race'], o => GAME_LABEL[o], st.game, sync);
  seg($('sHint'), ['normal', 'easy'], o => o === 'easy' ? '簡單' : '標準', st.hint);
  seg($('sPeek'), ['off', 'on'], fmtPeek, st.peek);
  seg($('sSet'), [10, 20, 30], o => o + ' 秒', st.setSec);
  sync();
  show('setWrap', true);
}
$('sSave').onclick = async () => {
  try {
    await act('settings', { patch: { roomName: $('sName').value, game: $('sGame').dataset.val, hint: $('sHint').dataset.val, peek: $('sPeek').dataset.val, setSec: $('sSet').dataset.val, turnSec: $('sTurn').dataset.val } });
    closePanels();
  } catch (e) { $('sMsg').textContent = e.message; }
};

// ---------- 投降 / 離開 / 房間按鈕 ----------
let armTimer = 0;
$('quitBtn').onclick = async () => {
  if (!S) return;
  const me = myPlayer(S);
  const canSurrender = me && !me.out && (S.phase === 'setting' || S.phase === 'playing');
  if (!canSurrender) return leave();
  const b = $('quitBtn');
  if (!b.classList.contains('arm')) {
    b.classList.add('arm'); b.textContent = '確定投降？';
    clearTimeout(armTimer);
    armTimer = setTimeout(() => { b.classList.remove('arm'); if (S) render(); }, 3000);
    return;
  }
  clearTimeout(armTimer); b.classList.remove('arm');
  try { await act('surrender'); } catch (e) { dmsg(e.message, true); }
};
async function leave() {
  try { await act('leave'); } catch (e) {}
  backToLobby();
}
$('roomActs').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  $('actMsg').textContent = '';
  if (a === 'leave') return leave();
  if (a === 'settings') return openSettings();
  try { await act(a); } catch (err) { $('actMsg').textContent = err.message; }
});

// ---------- 筆記 ----------
const marks = {};
for (let d = 0; d < 10; d++) {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = d;
  b.onclick = () => { marks[d] = ((marks[d] || 0) + 1) % 3; b.className = ['', 'x', 'y'][marks[d]]; };
  $('notes').appendChild(b);
}
function clearNotes() { $('notes').querySelectorAll('button').forEach((b, d) => { marks[d] = 0; b.className = ''; }); }

// ---------- 計時 ----------
setInterval(tick, 200);
function tick() {
  if (!S) return;
  const now = Date.now();
  const sec = deadline ? Math.max(0, Math.ceil((deadline - now) / 1000)) : 0;
  if (S.phase === 'setting') {
    $('count').textContent = sec;
    $('count').classList.toggle('low', sec <= 3);
    $('clock').textContent = '';
    bar((deadline - now) / total, sec <= 3);
  } else if (S.phase === 'playing' && deadline) {
    $('clock').textContent = sec + 's';
    $('clock').classList.toggle('low', sec <= 5);
    bar((deadline - now) / total, sec <= 5);
  } else {
    $('clock').textContent = S.phase === 'playing' && S.paused ? '暫停' : '';
    show('timebar', false);
  }
}
function bar(frac, low) {
  show('timebar', true);
  $('timebar').classList.toggle('low', low);
  $('timefill').style.transform = 'scaleX(' + Math.max(0, Math.min(1, frac)) + ')';
}

// ---------- 資料小工具 ----------
const myPlayer = s => s.players.find(p => p.me);
const duelOpp = s => s.players.find(p => !p.me);
const byPub = (s, pub) => s.players.find(p => p.pub === pub);
const hostName = s => { const h = s.players.find(p => p.host); return h ? h.name : ''; };
const isSpec = s => s.me.role === 'spec';

function resultHTML(g) {
  if (g.timeout) return '';
  return g.a === 0 && g.b === 0 ? '<span class="zero">0A0B</span>' : '<span class="ra">' + g.a + 'A</span><span class="rb">' + g.b + 'B</span>';
}
function digitsHTML(g) {
  if (!g.guess) return '••••'; // 數字被隱藏時（觀戰者沒開放看答案）
  return g.pos ? g.guess.split('').map((d, k) => g.pos.includes(k) ? '<span class="hit">' + d + '</span>' : d).join('') : g.guess;
}
// 答案顯示：自己的直接顯示；觀戰者看別人的有小眼睛可切換
function secretHTML(value, masked) {
  if (!value) return '';
  if (!masked) return '<span class="secret"><em>' + value + '</em></span>';
  return '<span class="secret"><em>' + (reveal ? value : '••••') + '</em><button type="button" class="eye" data-eye aria-label="' + (reveal ? '隱藏答案' : '顯示答案') + '">' + (reveal ? EYE_OFF : EYE) + '</button></span>';
}
document.addEventListener('click', e => {
  if (!e.target.closest('[data-eye]')) return;
  reveal = !reveal; LS.set('1a1b-reveal', reveal ? '1' : '0');
  if (S) render();
});

// ---------- 1 對 1 記分表 ----------
function cell(g, tint, isNew) {
  if (!g) return '<div class="cell' + (tint ? ' me' : '') + '"></div>';
  let cls = 'cell' + (tint ? ' me' : '') + (isNew ? ' new' : '');
  if (g.timeout) return '<div class="' + cls + ' to"><span class="dg">超時跳過</span></div>';
  if (g.a === 4) cls += ' win';
  return '<div class="' + cls + '"><span class="dg">' + digitsHTML(g) + '</span><span class="rs">' + resultHTML(g) + '</span></div>';
}
let lastMoves = -1;
function renderDuel(s) {
  const spec = isSpec(s);
  // 玩家：左欄自己、右欄對手；觀戰：依玩家順序
  const L = spec ? s.players[0] : myPlayer(s);
  const R = spec ? s.players[1] : duelOpp(s);
  if (!L || !R) { $('bhead').innerHTML = ''; $('rows').innerHTML = ''; return; }
  $('bhead').innerHTML = spec
    ? '<span></span><span class="me">' + esc(L.name) + ' 猜 ' + secretHTML(R.secret, s.phase !== 'over') + '</span><span>' + esc(R.name) + ' 猜 ' + secretHTML(L.secret, s.phase !== 'over') + '</span>'
    : '<span></span><span class="me">我猜對手</span><span>對手猜我 ' + secretHTML(L.secret, false) + '</span>';
  const a = L.guesses, b = R.guesses;
  const total = a.length + b.length;
  const fresh = lastMoves >= 0 && total > lastMoves;
  const starterIsL = s.starter ? s.starter === L.pub : true;
  const newest = !fresh ? null : (starterIsL ? (a.length > b.length ? 'L' : 'R') : (b.length > a.length ? 'R' : 'L'));
  let html = '';
  for (let r = 0; r < Math.max(a.length, b.length); r++) {
    html += '<div class="brow"><span class="n">' + (r + 1) + '</span>'
      + cell(a[r], true, newest === 'L' && r === a.length - 1)
      + cell(b[r], false, newest === 'R' && r === b.length - 1) + '</div>';
  }
  const first = s.starter ? byPub(s, s.starter) : null;
  $('rows').innerHTML = html || '<div class="empty">' + (spec ? (first ? first.name + ' 先猜' : '') : (first && first.me ? '你先猜，從下面輸入 4 個數字' : '對手先猜')) + '</div>';
  if (fresh || lastMoves < 0) $('sheet').scrollTop = $('sheet').scrollHeight;
  lastMoves = total;
}

// ---------- 多人競速 ----------
function lastResult(p) {
  for (let i = p.guesses.length - 1; i >= 0; i--) if (!p.guesses[i].timeout) return p.guesses[i];
  return null;
}
function raceStatus(s, p) {
  if (s.result && s.result.winners.includes(p.pub)) return ['猜中', 'done'];
  if (p.out) return ['已投降', ''];
  if (s.phase !== 'playing') return ['', ''];
  if (p.submitted) return ['已送出', 'done'];
  return [p.online ? '思考中' : '離線', ''];
}
function renderRace(s) {
  const spec = isSpec(s);
  const won = p => s.result && s.result.winners.includes(p.pub);
  let html = '';
  if (spec) html += s.answer ? '<div class="answer"><span>這局的答案</span>' + secretHTML(s.answer, s.phase !== 'over') + '</div>'
    : (s.phase === 'playing' ? '<div class="answer"><span>答案</span><span>房主沒開放觀戰看答案</span></div>' : '');

  if (spec) {
    // 觀戰：每位玩家一段，看得到每次猜的數字
    html += s.players.map(p => {
      const [st, cls] = raceStatus(s, p);
      const chips = p.guesses.map(g => g.timeout ? '<span class="gchip to">超時</span>'
        : '<span class="gchip' + (g.a === 4 ? ' win' : '') + '"><span class="dg">' + digitsHTML(g) + '</span><span class="rs">' + resultHTML(g) + '</span></span>').join('');
      return '<div class="pblock"><div class="hd"><span class="dot' + (p.online ? ' on' : '') + '"></span>' + esc(p.name)
        + '<span class="st ' + cls + '">' + st + '</span></div><div class="gchips">' + (chips || '<span class="gnone">還沒猜</span>') + '</div></div>';
    }).join('');
  } else {
    const me = myPlayer(s);
    const others = s.players.filter(p => !p.me);
    html += '<div class="stand">' + others.map(p => {
      const [st, cls] = raceStatus(s, p);
      const lr = lastResult(p);
      return '<div class="scard' + (p.out ? ' out' : '') + (won(p) ? ' win' : '') + '"><div class="nm"><span class="dot' + (p.online ? ' on' : '') + '"></span>' + esc(p.name) + '</div>'
        + '<div class="lr rs">' + (lr ? resultHTML(lr) : '<span class="zero">—</span>') + '</div>'
        + '<div class="st ' + cls + '">' + (st || ('猜了 ' + p.guesses.length + ' 次')) + '</div></div>';
    }).join('') + '</div>';
    html += '<div><div class="sect"><span class="me">我的猜測</span><span>' + (me ? me.guesses.filter(g => !g.timeout).length : 0) + ' 次</span></div>';
    const rows = me ? me.guesses.map((g, i) => '<div class="mrow"><span class="n">' + (i + 1) + '</span>' + cell(g, true, i === me.guesses.length - 1 && lastMoves >= 0 && me.guesses.length > lastMoves) + '</div>').join('') : '';
    html += rows || '<div class="empty">第 1 回合，從下面輸入你的第一個猜測</div>';
    html += '</div>';
    const fresh = me && me.guesses.length !== lastMoves;
    lastMoves = me ? me.guesses.length : 0;
    $('raceView').innerHTML = html;
    if (fresh) $('sheet').scrollTop = $('sheet').scrollHeight;
    return;
  }
  $('raceView').innerHTML = html;
}

// ---------- 等待區 ----------
function renderWait(s) {
  const st = s.settings;
  $('bigCode').textContent = s.code;
  $('chips').innerHTML = [GAME_LABEL[st.game], hintLabel(st.hint), st.game === 'duel' ? '設定數字 ' + st.setSec + ' 秒' : '', turnLabel(st.turnSec), st.peek === 'on' ? '觀戰可看答案' : '']
    .filter(Boolean).map(t => '<span class="chip">' + t + '</span>').join('');
  let rows = s.players.map(p => '<div class="prow"><span class="dot' + (p.online ? ' on' : '') + '"></span><span class="nm">' + esc(p.name) + (p.me ? '<small>（你）</small>' : '') + '</span>'
    + (p.host ? '<span class="tag host">房主</span>' : '') + '</div>').join('');
  for (let i = s.players.length; i < Math.min(s.max, s.players.length + (s.settings.game === 'duel' ? 2 : 1)); i++)
    rows += '<div class="prow vacant"><span class="dot"></span><span class="nm">等待加入…</span></div>';
  $('plist').innerHTML = '<div class="ph"><span>玩家</span><span>' + s.players.length + ' / ' + s.max + '</span></div>' + rows;
  $('shareUrl').textContent = inviteUrl(s);
}

// ---------- 底部按鈕 ----------
function renderActs(s) {
  const spec = isSpec(s);
  const btns = [];
  const n = s.players.length;
  const enough = s.settings.game === 'duel' ? n === 2 : n >= 2;
  if (s.phase === 'waiting' || s.phase === 'over') {
    if (spec) {
      if (s.canSit) btns.push('<button type="button" class="btn primary" data-act="sit">加入對戰</button>');
    } else if (s.me.host) {
      btns.push('<button type="button" class="btn" data-act="settings">設定</button>');
      btns.push('<button type="button" class="btn primary" data-act="start"' + (enough ? '' : ' disabled') + '>' + (s.phase === 'over' ? '再來一局' : '開始遊戲') + '</button>');
    } else {
      btns.push('<button type="button" class="btn" disabled>等房主' + (s.phase === 'over' ? '開下一局' : '開始') + '</button>');
    }
    if (s.phase === 'over') btns.unshift('<button type="button" class="btn" data-act="leave">離開</button>');
  }
  $('roomActs').innerHTML = btns.join('');
  show('roomActs', btns.length > 0);
  let hint = '';
  if (s.phase === 'waiting' && s.me.host && !enough) hint = s.settings.game === 'duel' ? (n > 2 ? '1 對 1 只能 2 人' : '還差 1 位玩家') : '至少要 2 位玩家';
  $('actMsg').textContent = hint;
}

// ---------- 結算 ----------
function renderOver(s) {
  const r = s.result, spec = isSpec(s);
  const me = myPlayer(s);
  const iWon = me && r.winners.includes(me.pub);
  const t = $('overTitle');
  let title, cls = '';
  if (s.settings.game === 'duel' && r.winners.length === 2) title = '平手';
  else if (!r.winners.length) title = '沒有人猜中';
  else if (spec) title = r.names.join('、') + (r.winners.length > 1 ? ' 並列獲勝' : ' 獲勝');
  else if (iWon) { title = r.winners.length > 1 ? '你並列第一' : '你贏了'; cls = 'win'; }
  else { title = '你輸了'; cls = 'lose'; }
  t.textContent = title; t.className = 'otitle ' + cls;

  const winner = r.winners.length ? byPub(s, r.winners[0]) : null;
  const tries = winner ? winner.guesses.filter(g => !g.timeout).length : 0;
  let why = '';
  if (r.reason === 'surrender') why = (me && r.by === me.pub ? '你' : r.byName) + ' 投降了';
  else if (r.reason === 'left') why = r.byName + ' 離開了房間';
  else if (r.reason === 'othersOut') why = '其他人都投降了';
  else if (r.reason === 'allOut') why = '大家都投降了';
  else if (s.settings.game === 'duel' && r.winners.length === 2) why = '雙方都猜中了';
  else if (winner) why = (iWon && r.winners.length === 1 ? '你' : r.names.join('、')) + ' 用了 ' + tries + ' 次猜中';
  $('overWhy').textContent = why;

  if (s.settings.game === 'race') $('reveal').innerHTML = '<span>答案<b>' + (s.answer || '—') + '</b></span>';
  else $('reveal').innerHTML = (spec ? s.players : [duelOpp(s), me]).filter(Boolean)
    .map(p => '<span>' + (spec ? esc(p.name) + ' 的數字' : p.me ? '你的數字' : '對手的數字') + '<b>' + (p.secret || '—') + '</b></span>').join('');
}

// ---------- 主畫面 ----------
function render() {
  const s = S, now = Date.now();
  const spec = isSpec(s), me = myPlayer(s), duel = s.settings.game === 'duel';
  const playing = s.phase === 'playing', over = s.phase === 'over';
  const host = hostName(s);

  $('roomTitle').textContent = roomTitle(s.name, host);
  $('roomCode').textContent = s.code;
  show('tagRace', !duel);
  show('tagEasy', s.settings.hint === 'easy');

  // 觀戰名單：所有人都看得到
  show('watchers', s.specs.length > 0);
  if (s.specs.length) {
    $('watchers').innerHTML = EYE.replace('<svg', '<svg aria-hidden="true"') + '<span>觀戰 <b>' + s.specs.length + '</b>　' + s.specs.map(w => esc(w.name) + (w.me ? '（你）' : '')).join('、') + '</span>';
  }

  // 數字盤用途
  let newMode = null;
  if (me && s.phase === 'setting' && !me.secret) newMode = 'secret';
  else if (me && playing && !me.out) newMode = 'guess';
  if (newMode !== mode) { entry = ''; dmsg(''); if (newMode === 'secret' || (newMode === 'guess' && !duel && s.round === 1 && !me.guesses.length)) clearNotes(); }
  mode = newMode;
  canGuess = !!me && playing && !me.out && (duel ? s.turn === me.pub : !me.submitted);
  deadline = s.msLeft ? now + s.msLeft : 0;
  total = s.msTotal || 1;

  // 狀態列左側
  const opp = duelOpp(s);
  let who;
  if (s.phase === 'waiting') who = '<span>' + GAME_LABEL[s.settings.game] + '</span><b>' + s.players.length + ' / ' + s.max + ' 人</b>';
  else if (duel && spec) who = '<b>' + esc((s.players[0] || {}).name || '') + '</b><span>vs</span><b>' + esc((s.players[1] || {}).name || '') + '</b>';
  else if (duel) who = '<span class="dot' + (opp && opp.online ? ' on' : '') + '"></span><span>對手</span><b>' + esc(opp ? opp.name : '尚未加入') + '</b>';
  else who = '<span>多人競速</span><b>' + s.players.length + ' 人</b>' + (spec ? '<span class="tag spec">觀戰中</span>' : '');
  if (duel && spec && s.phase !== 'waiting') who += '<span class="tag spec">觀戰中</span>';
  $('who').innerHTML = who;

  // 狀態文字
  let turn = '', sub = '', tcls = 'idle';
  const turnP = s.turn ? byPub(s, s.turn) : null;
  if (s.phase === 'waiting') {
    turn = s.me.host ? (spec ? '等待開始' : '準備好就開始') : '等待房主開始';
    sub = spec ? '你正在觀戰' : '';
  } else if (s.phase === 'setting') {
    if (spec) { turn = '雙方設定數字中'; }
    else { turn = me.secret ? (opp && opp.ready ? '準備開始' : '等對手設定') : '設定你的數字'; tcls = me.secret ? 'idle' : 'mine'; }
    const first = s.starter ? byPub(s, s.starter) : null;
    sub = first ? (first.me ? '這局你先猜' : first.name + ' 先猜') : '';
  } else if (playing && duel) {
    if (spec) turn = (turnP ? turnP.name : '') + ' 思考中';
    else { turn = canGuess ? '輪到你' : '對手思考中'; tcls = canGuess ? 'mine' : 'idle'; }
    if (s.lastChance) sub = spec ? '先手已猜中，後手最後一次追平機會' : canGuess ? '對手已猜中，這是你追平的最後機會' : '你猜中了，對手還有一次追平機會';
    else if (turnP) sub = '第 ' + (turnP.guesses.length + 1) + ' 回合';
  } else if (playing) {
    const act = s.players.filter(p => !p.out);
    const done = act.filter(p => p.submitted).length;
    turn = '第 ' + s.round + ' 回合';
    if (me && !me.out) { tcls = canGuess ? 'mine' : 'idle'; turn += canGuess ? '，輪到你猜' : '，等其他人'; }
    sub = '已送出 ' + done + ' / ' + act.length + (me && me.out ? '　你已投降，繼續看大家猜' : '');
  } else turn = '本局結束';
  $('turn').textContent = turn; $('turn').className = 'turn ' + tcls;
  $('sub').textContent = sub;

  // 中間區
  show('waitView', s.phase === 'waiting');
  show('setView', s.phase === 'setting');
  show('board', duel && (playing || over));
  show('raceView', !duel && (playing || over));
  if (s.phase === 'waiting') { renderWait(s); lastMoves = -1; }
  if (s.phase === 'setting') {
    $('setText').textContent = spec ? '時間到還沒設定的人，會自動選一組' : me.secret ? '你的數字已鎖定' : '時間到還沒設定，會自動幫你選一組';
    show('setMine', !!(me && me.secret));
    $('setMine').textContent = me && me.secret ? me.secret : '';
    lastMoves = -1;
  }
  if (duel && (playing || over)) renderDuel(s);
  if (!duel && (playing || over)) renderRace(s);
  show('notes', !!mode && playing);

  // 頂部投降 / 離開
  const q = $('quitBtn');
  if (!q.classList.contains('arm')) q.textContent = me && !me.out && (s.phase === 'setting' || playing) ? '投降' : '離開';
  show('quitBtn', !(over && !spec)); // 玩家結算時用下面的按鈕離開，觀戰者用這顆

  // 底部
  show('entry', !!mode);
  show('overPanel', over);
  if (over) renderOver(s);
  renderActs(s);
  show('dock', !!mode || over || !$('roomActs').classList.contains('hide'));
  if (mode === 'guess' && duel && me.auto && !me.guesses.length && opp && !opp.guesses.length && !entry)
    dmsg('時間到，已幫你選了 ' + me.secret);
  if (mode === 'guess' && !duel && me.submitted && !entry) dmsg('這回合已送出，等其他人');
  else if (mode === 'guess' && !duel && !me.submitted && $('dmsg').textContent === '這回合已送出，等其他人') dmsg('');
  renderEntry();
  renderChat();
  tick();
}

// ---------- 啟動 ----------
(function boot() {
  const code = (qs.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!code) return screen('lobby');
  if (SS.get('1a1b-pid-' + code)) return enter(code, 'player', LS.get('1a1b-name') || ''); // 重新整理：回到原本的房間
  openInvite(code);
})();
</script>
